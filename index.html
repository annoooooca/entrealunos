<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Entre Alunos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; color: #000; }

  /* Menu Lateral */
  aside {
    background-color: #1e3a8a; /* Azul frio */
  }
  aside button {
    transition: all 0.2s;
    color: black;
  }
  aside button:hover {
    background-color: #2563eb;
    transform: translateX(4px);
  }

  /* Cards */
  .card {
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    padding: 16px;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }

  /* Inputs */
  input, textarea {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 0.75rem;
    outline: none;
    transition: all 0.2s;
  }
  input:focus, textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
  }

  /* Botões */
  button {
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }

  /* Calendário */
  #calendarioGrid div {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 70px;
    border-radius: 10px;
    font-weight: bold;
    transition: transform 0.2s, background-color 0.2s;
    cursor: pointer;
    position: relative;
    background-color: #fff;
  }
  #calendarioGrid div:hover { 
    transform: scale(1.05); 
    background-color: #dbeafe; 
  }
  #calendarioGrid div:nth-child(7n+1), #calendarioGrid div:nth-child(7n) { background-color: #eff6ff; }
  .hoje { border: 3px solid #1e40af; }
  .evento { background-color: #bbf7d0; color: #065f46; font-weight: 600; }
  .tooltiptext {
    visibility: hidden;
    width: max-content;
    background-color: #1e293b;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 4px 8px;
    position: absolute;
    z-index: 10;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 0.75rem;
  }
  .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }

  /* Scrollbars */
  #listaForum::-webkit-scrollbar,
  #listaAvisos::-webkit-scrollbar,
  #listaChapas::-webkit-scrollbar,
  #listaEventos::-webkit-scrollbar { width: 6px; }
  #listaForum::-webkit-scrollbar-thumb,
  #listaAvisos::-webkit-scrollbar-thumb,
  #listaChapas::-webkit-scrollbar-thumb,
  #listaEventos::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }
  #listaForum::-webkit-scrollbar-track,
  #listaAvisos::-webkit-scrollbar-track,
  #listaChapas::-webkit-scrollbar-track,
  #listaEventos::-webkit-scrollbar-track { background-color: transparent; }
</style>
</head>
<body class="flex h-screen">

<!-- Menu Lateral -->
<aside class="w-64 p-6 flex flex-col gap-4 text-black">
  <h1 class="text-3xl font-bold text-white text-center mb-8">Entre Alunos</h1>
  <button onclick="mostrarTela('avisos')" class="py-3 px-4 rounded hover:bg-blue-500 transition">Mural de Avisos</button>
  <button onclick="mostrarTela('forum')" class="py-3 px-4 rounded hover:bg-blue-500 transition">Fórum</button>
  <button onclick="mostrarTela('calendario')" class="py-3 px-4 rounded hover:bg-blue-500 transition">Calendário</button>
  <button onclick="mostrarTela('chapas')" class="py-3 px-4 rounded hover:bg-blue-500 transition">Chapas</button>
  <button onclick="mostrarTela('jogos')" class="py-3 px-4 rounded hover:bg-blue-500 transition">Jogos</button>
  <button onclick="logout()" class="mt-auto py-3 px-4 rounded bg-red-500 hover:bg-red-600 transition font-semibold text-black">Sair</button>
</aside>

<!-- Conteúdo Principal -->
<main class="flex-1 p-6 flex flex-col gap-6 overflow-y-auto">

  <!-- Mural de Avisos -->
  <section id="avisos" class="hidden flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Mural de Avisos</h2>
    <div class="card flex flex-col gap-3">
      <!-- Caixa de escrita principal -->
      <form id="formAviso" class="flex gap-2">
        <input type="text" id="textoAviso" placeholder="Escreva um novo aviso..." class="flex-1">
        <button type="submit" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-3 rounded font-semibold text-black">Adicionar</button>
      </form>
      <ul id="listaAvisos" class="space-y-2 max-h-80 overflow-y-auto"></ul>
    </div>
  </section>

  <!-- Fórum -->
  <section id="forum" class="hidden flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Fórum</h2>
    <div class="card flex-1 flex flex-col gap-3">
      <div id="listaForum" class="flex-1 overflow-y-auto space-y-2"></div>
      <form id="formForum" class="flex gap-2 mt-2">
        <input type="text" id="textoForum" placeholder="Digite sua mensagem..." class="flex-1">
        <button type="submit" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-3 rounded font-semibold text-black">Enviar</button>
      </form>
    </div>
  </section>

  <!-- Calendário -->
  <section id="calendario" class="hidden flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Calendário</h2>
    <div class="flex justify-center gap-4">
      <button onclick="mudarMes(-1)" class="px-3 py-1 bg-white rounded border hover:bg-gray-100 transition">◀</button>
      <span id="mesAtual" class="text-xl font-semibold"></span>
      <button onclick="mudarMes(1)" class="px-3 py-1 bg-white rounded border hover:bg-gray-100 transition">▶</button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center font-semibold">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div id="calendarioGrid" class="grid grid-cols-7 gap-2 mb-4"></div>
    <form id="formEvento" class="hidden flex flex-wrap gap-2 items-center">
      <input type="date" id="dataEvento" class="border p-2 rounded">
      <input type="text" id="descEvento" placeholder="Descrição" class="border p-2 rounded flex-1">
      <button type="submit" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-2 rounded font-semibold text-black">Adicionar Evento</button>
    </form>
    <ul id="listaEventos" class="space-y-2 flex-1 overflow-y-auto"></ul>
  </section>

  <!-- Chapas -->
  <section id="chapas" class="hidden flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Chapas e Propostas</h2>
    <form id="formChapa" class="hidden flex flex-col gap-3">
      <input type="text" id="nomeChapa" placeholder="Nome da chapa">
      <textarea id="propostaChapa" placeholder="Proposta da chapa" class="h-28 resize-none"></textarea>
      <input type="text" id="integrantesChapa" placeholder="Integrantes separados por vírgula">
      <input type="file" id="imagemChapa" accept="image/*">
      <button type="submit" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-3 rounded font-semibold text-black">Adicionar Chapa</button>
    </form>
    <ul id="listaChapas" class="space-y-2 flex-1 overflow-y-auto"></ul>
  </section>

  <!-- Jogos -->
  <section id="jogos" class="hidden flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Jogos</h2>
    <div class="flex flex-col gap-2">
      <button onclick="abrirJogo('jogo/jogo-da-memoria.html')" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-3 rounded font-semibold text-black">Jogo da Memória</button>
      <button onclick="abrirJogo('jogo/jogo-do-simon.html')" class="bg-blue-300 hover:bg-blue-400 transition px-4 py-3 rounded font-semibold text-black">Jogo do Simon</button>
    </div>
    <div id="gameContainer" class="flex justify-center items-center w-full h-96 border rounded bg-white">
      <p>Escolha um jogo acima para jogar.</p>
    </div>
  </section>

</main>

<script>
  // ---------- Funcionalidades ----------
  let role = localStorage.getItem("role");
  if(!role) window.location.href="login.html";

  function mostrarTela(tela){
    document.querySelectorAll("main section").forEach(sec=>sec.classList.add("hidden"));
    document.getElementById(tela).classList.remove("hidden");
    if(tela==="avisos") renderAvisos();
    if(tela==="forum") renderForum();
    if(tela==="calendario") renderCalendario();
    if(tela==="chapas") renderChapas();
  }
  function logout(){ localStorage.removeItem("role"); window.location.href="home.html"; }

  function abrirJogo(url){
    document.getElementById("gameContainer").innerHTML = `<iframe src="${url}" class="w-full h-full border-0 rounded"></iframe>`;
  }

  mostrarTela("avisos");
</script>

</body>
</html>
